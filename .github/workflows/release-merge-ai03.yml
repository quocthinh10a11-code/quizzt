name: temporary release merge

on:
  push:
    branches:
      - agent/ai-02-learning-insight

permissions:
  contents: write

jobs:
  merge-main-into-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ai-02-learning-insight

      - name: Merge main while preserving release changes on conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-edit -X ours origin/main
          git rm .github/workflows/release-merge-ai03.yml
          git rm .github/workflows/.release-merge-ai03.yml || true
          git commit -m "chore: resolve release branch against main"
          git push origin HEAD:agent/ai-02-learning-insight
