name: temporary practice merge hotfix

on:
  push:
    branches:
      - agent/ai-02-learning-insight

permissions:
  contents: write

jobs:
  fix-merge-regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ai-02-learning-insight

      - name: Remove duplicate JSX branch introduced by merge
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/practice/[id]/page.tsx")
          text = path.read_text(encoding="utf-8")

          insertion = '''          {session.attemptId !== null && <LearningInsightCard attemptId={session.attemptId} />}\n'''
          anchor = '''          </Card>\n        </>\n      ) : (\n        <>\n          <Card className="p-8 text-center">'''
          if text.count(anchor) != 1:
              raise SystemExit(f"Expected exactly one malformed merge anchor, found {text.count(anchor)}")

          text = text.replace(
              anchor,
              '''          </Card>\n''' + insertion + '''        </>\n      ) : (\n        <>\n          <Card className="p-8 text-center">''',
              1,
          )

          start = '''      ) : (\n        <>\n          <Card className="p-8 text-center">'''
          end = '''\n      {session.started && ('''
          start_index = text.find(start)
          if start_index == -1:
              raise SystemExit("Duplicate JSX branch start not found")
          end_index = text.find(end, start_index)
          if end_index == -1:
              raise SystemExit("Duplicate JSX branch end not found")

          text = text[:start_index] + '''      )}''' + text[end_index:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify syntax and build
        run: |
          npm ci
          npm run build

      - name: Commit hotfix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-practice-merge.yml
          git add app/practice/[id]/page.tsx
          git commit -m "fix: resolve practice page merge regression"
          git push origin HEAD:agent/ai-02-learning-insight
