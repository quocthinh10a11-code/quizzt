name: one-time-build-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip build-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix type error and format touched files
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/usePracticeSession.ts')
          text = p.read_text()
          text = text.replace('if (target?.isContentEditable || ["INPUT", "TEXTAREA", "SELECT", "BUTTON"].includes(target.tagName)) return;', 'if (target?.isContentEditable || (target && ["INPUT", "TEXTAREA", "SELECT", "BUTTON"].includes(target.tagName))) return;')
          p.write_text(text)
          PY
          npx prettier --write app/layout.tsx lib/usePracticeSession.ts components/ui/ConfirmProvider.tsx
      - name: Commit
        run: |
          rm -f .github/workflows/one-time-build-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(build): guard keyboard event target [skip build-fix]" || exit 0
          git push
